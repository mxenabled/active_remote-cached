name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.1'
          - '3.4'
          - jruby-9.4
          - jruby-10.0
        gemfile:
          - active_remote_6.1.gemfile
          - active_remote_7.0.gemfile
          - active_remote_7.1.gemfile
          - active_remote_7.2.gemfile
          - active_remote_8.0.gemfile
        exclude:
          # active_remote 8.0 requires ruby 3.2 or later
          - ruby: '3.1'
            gemfile: active_remote_8.0.gemfile
          - ruby: jruby-9.4
            gemfile: active_remote_8.0.gemfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

  rubocop:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop --parallel
